name: 检查个人主页

on:
  push:
    paths:
      - '*.md'
      - 'scripts/**'
      - 'static/svg/**'
      - '.github/workflows/**'
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: 检出主页源码
        uses: actions/checkout@v4
      - name: 检查生成文件、链接和图片说明
        run: python3 scripts/render_profile.py --check
      - name: 检查差异格式
        run: git diff --check
