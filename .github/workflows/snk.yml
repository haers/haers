name: 更新贡献贪吃蛇

on:
  schedule:
    # UTC 00:00，对应北京时间 08:00。
    - cron: "0 0 * * *"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: contribution-snake-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: 检出主页源码
        uses: actions/checkout@v4
        with:
          ref: main

      # 接口来源：https://github.com/Platane/snk，仅读取公开贡献并输出两张 SVG。
      - name: 生成明暗主题贡献图
        uses: Platane/snk/svg-only@v3.2.0
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            github-contribution-snake/github-contribution-grid-snake.svg
            github-contribution-snake/github-contribution-grid-snake-dark.svg?palette=github-dark

      - name: 检查主页与生成资源
        run: python3 scripts/render_profile.py --check

      - name: 仅提交两张贡献图
        shell: bash
        run: |
          set -euo pipefail
          git add -- github-contribution-snake/github-contribution-grid-snake.svg github-contribution-snake/github-contribution-grid-snake-dark.svg
          if git diff --cached --quiet; then
            echo "贡献图没有变化"
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): 更新贡献贪吃蛇'
          git push --dry-run origin HEAD:main
          git push origin HEAD:main
