name: 更新贡献效果样例

on:
  schedule:
    # 北京时间 08:15。
    - cron: '15 0 * * *'
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - '.github/workflows/effects.yml'

permissions:
  contents: write

concurrency:
  group: contribution-effects-main
  cancel-in-progress: false

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - name: 检出主页源码
        uses: actions/checkout@v5
        with:
          ref: main

      # 来源：https://github.com/yoshi389111/github-profile-3d-contrib
      - name: 生成 3D 贡献日历
        uses: yoshi389111/github-profile-3d-contrib@7d95e7d4cdc028dd1e1cbd957d65f35efb12ae39
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          USERNAME: ${{ github.repository_owner }}

      # 来源：https://github.com/abozanona/pacman-contribution-graph
      - name: 生成吃豆人贡献动画
        uses: abozanona/pacman-contribution-graph@70945878b1118303b37b88060fc7145e1a57d7b1
        with:
          github_user_name: ${{ github.repository_owner }}
          games: pacman,breakout,galaga,puzzle-bobble,bomberman,minesweeper,snake,tetris

      - name: 收集明暗主题产物
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/prepare_effects.py
          python3 scripts/render_profile.py
          python3 scripts/render_profile.py --check

      - name: 仅提交效果与同源样例页
        shell: bash
        run: |
          set -euo pipefail
          git add -- static/effects/profile-green.svg static/effects/profile-green-animate.svg static/effects/profile-season.svg static/effects/profile-season-animate.svg static/effects/profile-south-season.svg static/effects/profile-south-season-animate.svg static/effects/profile-night-view.svg static/effects/profile-night-green.svg static/effects/profile-night-rainbow.svg static/effects/profile-gitblock.svg static/effects/pacman.svg static/effects/pacman-dark.svg static/effects/breakout.svg static/effects/breakout-dark.svg static/effects/galaga.svg static/effects/galaga-dark.svg static/effects/puzzle-bobble.svg static/effects/puzzle-bobble-dark.svg static/effects/bomberman.svg static/effects/bomberman-dark.svg static/effects/minesweeper.svg static/effects/minesweeper-dark.svg static/effects/snake.svg static/effects/snake-dark.svg static/effects/tetris.svg static/effects/tetris-dark.svg examples/contributions/arcade.md examples/contributions/3d-calendar.md
          if git diff --cached --quiet; then
            echo '效果没有变化'
            exit 0
          fi
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'chore(profile): 更新贡献效果与样例'
          git push --dry-run origin HEAD:main
          git push origin HEAD:main
